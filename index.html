<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4benies Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-raised: #1c1c1c;
    --surface-hover: #252525;
    --text: #ececec;
    --text-secondary: #999;
    --text-muted: #666;
    --green: #1db954;
    --green-soft: #1ed760;
    --green-dim: rgba(29, 185, 84, 0.12);
    --red: #e05555;
    --red-dim: rgba(224, 85, 85, 0.12);
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  /* Hero / Playlist Header */
  .playlist-header {
    display: flex;
    gap: 1.25rem;
    align-items: flex-end;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .cover-art {
    width: 120px;
    height: 120px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .cover-placeholder {
    width: 120px;
    height: 120px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-raised) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: var(--text-muted);
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .playlist-meta {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 0;
  }

  .playlist-type {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .playlist-name {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playlist-name a {
    color: inherit;
    text-decoration: none;
    transition: color 0.15s;
  }

  .playlist-name a:hover {
    color: var(--green);
  }

  .playlist-owner {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .playlist-owner strong {
    color: var(--text);
    font-weight: 500;
  }

  .playlist-description {
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.4;
    margin-top: 0.15rem;
    max-height: 6em;
    overflow: hidden;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin-top 0.3s ease;
  }

  /* Negative margin cancels the parent's 0.3rem flex gap while collapsed. */
  .playlist-description.is-hidden {
    opacity: 0;
    max-height: 0;
    margin-top: -0.3rem;
  }

  .fade-swap { transition: opacity 0.15s ease; }
  .fade-swap.is-fading { opacity: 0; }

  @keyframes cover-in {
    from { opacity: 0; transform: scale(0.97); }
  }

  .cover-art.cover-swap { animation: cover-in 0.35s ease-out; }

  .playlist-owner a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .playlist-owner a:hover {
    border-bottom-color: var(--text-secondary);
  }

  /* Playlist selector */
  .playlist-select {
    width: 100%;
    padding: 0.6rem 0.85rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    margin-bottom: 1.25rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }

  .playlist-select:focus {
    border-color: var(--green);
  }

  /* Calendar */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    margin-bottom: 1.75rem;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.85rem;
  }

  .cal-header button {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: inherit;
  }

  .cal-header button:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .cal-header .month-label {
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: -0.01em;
  }

  @keyframes cal-in-next {
    from { opacity: 0; transform: translateX(16px); }
  }

  @keyframes cal-in-prev {
    from { opacity: 0; transform: translateX(-16px); }
  }

  .slide-next { animation: cal-in-next 0.28s ease-out; }
  .slide-prev { animation: cal-in-prev 0.28s ease-out; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
  }

  .cal-dow {
    font-size: 0.65rem;
    color: var(--text-muted);
    padding: 0.35rem 0;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .cal-day {
    position: relative;
    padding: 0.45rem 0;
    font-size: 0.8rem;
    border-radius: 6px;
    cursor: default;
    color: var(--text-muted);
    transition: all 0.12s;
  }

  button.cal-day {
    border: 0;
    background: none;
    font-family: inherit;
    line-height: inherit;
    width: 100%;
  }

  .cal-day.has-snapshot {
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
  }

  button:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .cal-day.has-snapshot:hover {
    background: var(--surface-hover);
  }

  .cal-day.changed::after {
    content: '';
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: var(--green);
    border-radius: 50%;
  }

  .cal-day.selected {
    background: var(--green);
    color: #fff;
    font-weight: 600;
  }

  .cal-day.selected::after {
    background: rgba(255,255,255,0.8);
  }

  .cal-day.other-month {
    opacity: 0.2;
  }

  /* Snapshot info bar */
  .snapshot-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    padding: 0 0.25rem;
  }

  .snapshot-date-label {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .snapshot-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--surface);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
  }

  .time-chips {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    padding: 0 0.25rem;
  }

  .time-chips-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-right: 0.25rem;
  }

  .chip-latest {
    font-size: 0.55rem;
    color: var(--text-muted);
    margin-left: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .time-chip.active .chip-latest {
    color: var(--green-soft);
    opacity: 0.7;
  }

  .diff-caption {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 0 0.25rem;
    margin-bottom: 0.3rem;
  }

  .time-chip {
    font-size: 0.7rem;
    font-family: inherit;
    font-weight: 500;
    padding: 0.25rem 0.55rem;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: none;
    color: var(--text-secondary);
    transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }

  .time-chip:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .time-chip.active {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green-soft);
  }

  .snapshot-time-meta {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .diff-summary {
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .diff-summary .added-text { color: var(--green-soft); }
  .diff-summary .removed-text { color: var(--red); }
  .diff-summary .moved-text { color: var(--text); }

  .diff-toggle {
    margin-left: auto;
    font-size: 0.75rem;
    font-family: inherit;
    font-weight: 500;
    padding: 0.25rem 0.6rem;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: none;
    color: var(--text-secondary);
    transition: all 0.15s;
    white-space: nowrap;
  }

  .diff-toggle:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .diff-toggle.active {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green-soft);
  }

  /* Day nav */
  .day-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.75rem;
    gap: 0.5rem;
  }

  .day-nav button {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    transition: all 0.15s;
    font-family: inherit;
  }

  .day-nav-arrow {
    font-size: 1rem;
    line-height: 0;
    position: relative;
    top: -1px;
  }

  .day-nav button:hover:not(:disabled) {
    background: var(--surface-hover);
    border-color: var(--green);
    color: var(--text);
  }

  .day-nav button:disabled {
    opacity: 0.15;
    cursor: default;
  }

  /* Track list */
  .track-list {
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .track {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.85rem;
    transition: background 0.12s;
    border-bottom: 1px solid var(--border);
  }

  .track:last-child { border-bottom: none; }

  /* max-height can't interpolate to "none", so 80px stands in for a row's
     full height; rows are single-line and well under it. */
  @keyframes track-enter {
    from {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-bottom-width: 0;
    }
    60% { opacity: 0; }
    to { opacity: 1; max-height: 80px; }
  }

  @keyframes track-leave {
    from { opacity: 1; max-height: 80px; }
    40% { opacity: 0; }
    to {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-bottom-width: 0;
    }
  }

  .track.enter {
    overflow: hidden;
    animation: track-enter 0.36s ease-out backwards;
    animation-delay: calc(var(--i, 0) * 35ms);
  }

  .track.leave {
    overflow: hidden;
    animation: track-leave 0.22s ease-in forwards;
  }

  @media (prefers-reduced-motion: reduce) {
    .track.enter, .track.leave,
    .slide-next, .slide-prev,
    .cover-art.cover-swap { animation: none; }
    .playlist-description, .fade-swap { transition: none; }
  }

  .track:hover {
    background: var(--surface-hover);
  }

  .track.added {
    background: var(--green-dim);
  }
  .track.added:hover {
    background: rgba(29, 185, 84, 0.18);
  }

  .track.removed {
    background: var(--red-dim);
    opacity: 0.6;
  }

  .track-num {
    color: var(--text-muted);
    font-size: 0.75rem;
    min-width: 1.5rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-name {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }

  .track.removed .track-name {
    text-decoration: line-through;
    text-decoration-color: var(--red);
  }

  .track-artist {
    font-size: 0.75rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-duration {
    color: var(--text-muted);
    font-size: 0.75rem;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .track-link {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-decoration: none;
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    transition: all 0.15s;
  }

  .track-link:hover {
    color: var(--green);
    background: var(--green-dim);
  }

  .track-link svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  .diff-badge {
    font-size: 0.6rem;
    font-weight: 700;
    min-width: 1.5rem;
    text-align: center;
    padding: 0.15rem 0.3rem;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .site-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .site-footer a {
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .site-footer a:hover {
    border-bottom-color: var(--text-secondary);
  }

  .embed-section {
    margin-bottom: 1.75rem;
  }

  .embed-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 0.5rem;
    padding: 0 0.25rem;
  }

  .embed-frame {
    width: 100%;
    height: 152px;
    border: 0;
    border-radius: var(--radius-sm);
    display: block;
  }

  /* Wide viewports: playlist header spans the full width; calendar and
     embed sit side-by-side below it. Embed is placed in col 2 across the
     rows occupied by calendar+trackSection so its 500px height fits
     inside the natural height of those rows without stretching either. */
  @media (min-width: 960px) {
    .container {
      display: grid;
      grid-template-columns: 640px minmax(320px, 400px);
      column-gap: 2.5rem;
      max-width: 1080px;
      align-items: start;
    }
    .playlist-header {
      grid-column: 1 / -1;
      grid-row: 1;
    }
    .playlist-select {
      grid-column: 1;
      grid-row: 2;
    }
    .calendar {
      grid-column: 1;
      grid-row: 3;
    }
    #trackSection {
      grid-column: 1;
      grid-row: 4;
    }
    .embed-section {
      grid-column: 2;
      grid-row: 3 / span 2;
      align-self: start;
      position: sticky;
      top: 2rem;
      margin-bottom: 0;
    }
    .embed-section .embed-frame {
      height: 500px;
    }
    .site-footer {
      grid-column: 1 / -1;
      grid-row: 5;
    }
  }

  .diff-badge.added-badge {
    background: var(--green-dim);
    color: var(--green-soft);
  }

  .diff-badge.moved-badge {
    background: rgba(255,255,255,0.08);
    color: var(--text-secondary);
  }

  .track.moved {
    background: rgba(255,255,255,0.04);
  }

  .diff-badge.removed-badge {
    background: var(--red-dim);
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem;
    font-size: 0.85rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.25rem 1rem; }
    .playlist-header { gap: 1rem; }
    .cover-art, .cover-placeholder { width: 88px; height: 88px; }
    .playlist-name { font-size: 1.35rem; }
    .track { padding: 0.55rem 0.65rem; gap: 0.5rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="playlist-header" id="playlistHeader">
    <div class="cover-placeholder" id="coverArt">♫</div>
    <div class="playlist-meta">
      <span class="playlist-type">Playlist</span>
      <h1 class="playlist-name"><a id="title" href="#">4benies Tracker</a></h1>
      <span class="playlist-description is-hidden" id="description"></span>
      <span class="playlist-owner" id="owner"></span>
    </div>
  </div>

  <select class="playlist-select" id="playlistSelect" style="display: none;"></select>

  <div class="calendar" id="calendar"></div>

  <div class="embed-section" id="embedSection" style="display: none;">
    <div class="embed-label">Listen · Current version</div>
    <iframe class="embed-frame" id="embedFrame"
            allowfullscreen
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"
            loading="lazy"></iframe>
  </div>

  <div id="trackSection"></div>

  <footer class="site-footer">
    a record of bonnie's gift to us, made with love by twitter user
    <a href="https://x.com/mintbluetoyota" target="_blank" rel="noopener">@mintbluetoyota</a>.
  </footer>
</div>

<script src="diff.js"></script>
<script>
const BASE = '';
const SPOTIFY_ICON = '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>';
const SINCE_PHRASE = 'since last snapshot';
let indexData = null;
let currentPlaylist = null;
let calYear, calMonth;
let selectedDate = null;
let snapshotCache = {};
let currentCoverArt = null;
let currentOwner = null;
let showDiff = false;
let viewMode = 'fullday';  // 'fullday' (All changes) | 'update' (a specific time chip)
let lastSnap = null;
let lastPrevSnap = null;
let lastPrevDaySnap = null;
let lastRequestedDate = null;
let lastIsExactSnapshot = false;
let lastEntry = null;
let renderedUrls = null;
let lastRenderedFile = null;
let renderToken = 0;
let loadToken = 0;
let loadingTimer = null;
let lastCalMonthKey = null;
const LEAVE_MS = 220;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to fetch ${url}`);
  return res.json();
}

// Promise cache: concurrent requests for the same snapshot share one fetch,
// and a failed fetch is evicted so a retry can succeed. Callers pass an entry
// (or null); a null entry resolves to null so consumers can Promise.all a
// mixed array without branching.
function getSnapshot(entry) {
  if (!entry) return Promise.resolve(null);
  const pid = currentPlaylist.id;
  const key = `${pid}/${entry.file}`;
  if (!snapshotCache[key]) {
    snapshotCache[key] = fetchJSON(`${BASE}snapshots/${pid}/${entry.file}`)
      .catch(err => { delete snapshotCache[key]; throw err; });
  }
  return snapshotCache[key];
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// All dates in this app (snapshot filenames, snapshot_date fields, calendar
// grid) are UTC. Use UTC "today" and UTC month/year so a user in a non-UTC
// timezone sees the same date the dataset uses — otherwise, near midnight
// UTC, the selected date can fall outside the visible calendar month.
function todayUtcDate() {
  return new Date().toISOString().slice(0, 10);
}

function formatTimeOfDay(iso) {
  const m = iso.match(/T(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]} UTC` : iso;
}

function formatElapsed(fromIso, toIso) {
  const from = new Date(fromIso).getTime();
  const to = new Date(toIso).getTime();
  let sec = Math.max(0, Math.floor((to - from) / 1000));
  const d = Math.floor(sec / 86400); sec -= d * 86400;
  const h = Math.floor(sec / 3600);  sec -= h * 3600;
  const m = Math.floor(sec / 60);
  const parts = [];
  if (d) parts.push(`${d}d`);
  if (h || d) parts.push(`${h}h`);
  parts.push(`${m}m`);
  return parts.join(' ');
}

// Returns Map<dateStr, Array<{date, time, file}>> sorted ascending by time within each day
function groupSnapshotsByDate(snapshots) {
  const byDate = new Map();
  for (const s of snapshots) {
    if (!byDate.has(s.date)) byDate.set(s.date, []);
    byDate.get(s.date).push(s);
  }
  for (const arr of byDate.values()) arr.sort((a, b) => a.time.localeCompare(b.time));
  return byDate;
}

// Returns the latest snapshot on-or-before targetDate, or null.
function findLatestSnapshotOnOrBefore(snapshots, targetDate) {
  let best = null;
  for (const s of snapshots) {
    if (s.date <= targetDate && (!best || s.time > best.time)) best = s;
  }
  return best;
}

// Returns the newest snapshot strictly earlier than `current` that also
// satisfies `predicate`, or null. Single pass — no sort needed.
function findPrevious(snapshots, current, predicate) {
  let best = null;
  for (const s of snapshots) {
    if (s.time >= current.time) continue;
    if (!predicate(s)) continue;
    if (!best || s.time > best.time) best = s;
  }
  return best;
}

// Snapshot immediately preceding `current` in time order (any date).
function getPreviousSnapshotEntry(snapshots, current) {
  return findPrevious(snapshots, current, () => true);
}

// Latest snapshot on any date strictly before `current.date`.
function getPreviousDayLastSnapshot(snapshots, current) {
  return findPrevious(snapshots, current, s => s.date < current.date);
}

function getSortedSnapshotDates() {
  if (!currentPlaylist) return [];
  return [...new Set(currentPlaylist.snapshots.map(s => s.date))].sort();
}


// Nearest day with a change strictly before (delta < 0) or after the selected
// date. Relative to the selected date, not the snapshot on screen: on a quiet
// day the page shows an older snapshot, and that snapshot's day is the
// previous change.
function adjacentChangeDate(delta) {
  const dates = getSortedSnapshotDates();
  if (delta < 0) return dates.filter(d => d < selectedDate).pop() || null;
  return dates.find(d => d > selectedDate) || null;
}

function navigateDay(delta) {
  const target = adjacentChangeDate(delta);
  if (!target) return;
  const [y, m] = target.split('-').map(Number);
  if (y !== calYear || m - 1 !== calMonth) { calYear = y; calMonth = m - 1; }
  selectDate(target);
}

function renderDayNavHtml() {
  if (!lastEntry) return '';
  const hasPrev = !!adjacentChangeDate(-1);
  const hasNext = !!adjacentChangeDate(1);
  const onToday = selectedDate === todayUtcDate();
  return `<div class="day-nav">
    <button onclick="navigateDay(-1)"${hasPrev ? '' : ' disabled'}><span class="day-nav-arrow" aria-hidden="true">&#8249;</span>Jump to previous change</button>
    <button onclick="goToToday()"${onToday ? ' disabled' : ''}>Today</button>
    <button onclick="navigateDay(1)"${hasNext ? '' : ' disabled'}>Jump to next change<span class="day-nav-arrow" aria-hidden="true">&#8250;</span></button>
  </div>`;
}

function goToToday() {
  const today = todayUtcDate();
  const [y, m] = today.split('-').map(Number);
  calYear = y;
  calMonth = m - 1;
  selectDate(today);
}


function updateHeader(snap) {
  const coverEl = document.getElementById('coverArt');
  const ownerEl = document.getElementById('owner');
  const descEl = document.getElementById('description');

  const titleEl = document.getElementById('title');
  const name = (snap && snap.playlist_name) || (currentPlaylist && currentPlaylist.name);
  if (name && titleEl.textContent !== name) {
    swapContent(titleEl, () => { titleEl.textContent = name; });
  }

  if (snap && snap.cover_art) {
    if (coverId(currentCoverArt) !== coverId(snap.cover_art)) {
      const img = document.createElement('img');
      img.className = 'cover-art cover-swap';
      img.id = 'coverArt';
      img.alt = 'Playlist cover';
      img.src = snap.cover_art;
      coverEl.replaceWith(img);
      currentCoverArt = snap.cover_art;
    }
  } else if (!currentCoverArt) {
    coverEl.outerHTML = '<div class="cover-placeholder" id="coverArt">♫</div>';
  }

  const ownerName = (snap && snap.owner) || currentOwner;
  const ownerUrl = currentPlaylist && currentPlaylist.owner_url;
  if (ownerName) {
    const nameHtml = `<strong>${escapeHtml(ownerName)}</strong>`;
    const linked = ownerUrl
      ? `<a href="${safeUrl(ownerUrl)}" target="_blank" rel="noopener">${nameHtml}</a>`
      : nameHtml;
    const html = `by ${linked}`;
    if (!ownerEl.dataset.html) ownerEl.innerHTML = html;
    else if (ownerEl.dataset.html !== html) swapContent(ownerEl, () => { ownerEl.innerHTML = html; });
    ownerEl.dataset.html = html;
    if (snap && snap.owner) currentOwner = snap.owner;
  }

  // Text is kept while collapsing so it fades out instead of vanishing.
  const desc = (snap && snap.description) || '';
  if (!desc) {
    descEl.classList.add('is-hidden');
  } else if (descEl.classList.contains('is-hidden')) {
    descEl.textContent = desc;
    descEl.classList.remove('is-hidden');
  } else if (descEl.textContent !== desc) {
    swapContent(descEl, () => { descEl.textContent = desc; });
  }
}

// Fade an element out, change it, and fade it back in.
function swapContent(el, apply) {
  if (reducedMotion.matches) { apply(); return; }
  el.classList.add('fade-swap', 'is-fading');
  setTimeout(() => { apply(); el.classList.remove('is-fading'); }, 150);
}

// Ease an element from oldH to whatever height its new content needs.
function animateHeight(el, oldH) {
  el.style.transition = '';
  el.style.height = '';
  const newH = el.offsetHeight;
  if (!oldH || oldH === newH || reducedMotion.matches) return;
  el.style.height = oldH + 'px';
  el.offsetHeight;  // force layout so the transition starts from oldH
  el.style.transition = 'height 0.28s ease';
  el.style.height = newH + 'px';
  setTimeout(() => {
    if (el.style.height === newH + 'px') { el.style.height = ''; el.style.transition = ''; }
  }, 320);
}

// --- Calendar ---

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const snapshots = currentPlaylist ? currentPlaylist.snapshots : [];
  const byDate = groupSnapshotsByDate(snapshots);
  const sortedDates = [...byDate.keys()].sort();
  const firstDate = sortedDates.length > 0 ? sortedDates[0] : null;

  const monthNames = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let html = `
    <div class="cal-header">
      <button onclick="changeMonth(-1)" aria-label="Previous month">&#8249;</button>
      <span class="month-label">${monthNames[calMonth]} ${calYear}</span>
      <button onclick="changeMonth(1)" aria-label="Next month">&#8250;</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">Su</div><div class="cal-dow">Mo</div>
      <div class="cal-dow">Tu</div><div class="cal-dow">We</div>
      <div class="cal-dow">Th</div><div class="cal-dow">Fr</div>
      <div class="cal-dow">Sa</div>
  `;

  for (let i = firstDay - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month">${daysInPrev - i}</div>`;
  }

  const today = todayUtcDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isSnapshotDate = byDate.has(dateStr);
    const canRender = firstDate && dateStr >= firstDate && dateStr <= today;
    const isSelected = dateStr === selectedDate;
    const classes = ['cal-day'];
    if (canRender) classes.push('has-snapshot');
    if (isSnapshotDate) classes.push('changed');
    if (isSelected) classes.push('selected');
    if (canRender) {
      const label = `${monthNames[calMonth]} ${d}, ${calYear}${isSnapshotDate ? ', playlist changed' : ''}`;
      html += `<button type="button" class="${classes.join(' ')}" aria-label="${label}" aria-pressed="${isSelected}" onclick="selectDate('${dateStr}')">${d}</button>`;
    } else {
      html += `<div class="${classes.join(' ')}">${d}</div>`;
    }
  }

  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month">${i}</div>`;
  }

  html += '</div>';

  const monthKey = calYear * 12 + calMonth;
  const dir = lastCalMonthKey === null ? 0 : Math.sign(monthKey - lastCalMonthKey);
  lastCalMonthKey = monthKey;
  const oldH = cal.offsetHeight;
  cal.innerHTML = html;
  if (dir) {
    const cls = dir > 0 ? 'slide-next' : 'slide-prev';
    cal.querySelector('.cal-grid').classList.add(cls);
    cal.querySelector('.month-label').classList.add(cls);
    animateHeight(cal, oldH);
  }
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

// --- Selection ---

async function selectDate(dateStr) {
  if (!currentPlaylist) return;

  const latest = findLatestSnapshotOnOrBefore(currentPlaylist.snapshots, dateStr);

  if (!latest) {
    showTracksEmpty('No snapshots before this date.');
    selectedDate = dateStr;
    renderCalendar();
    return;
  }

  selectedDate = dateStr;
  viewMode = 'fullday';
  renderCalendar();
  await loadSnapshot(latest, dateStr !== latest.date ? dateStr : null);
}

// Keep the track section tall enough that the current scroll position stays
// valid when the list gets shorter; otherwise the browser clamps scrollY and
// the page jumps. The reserve is released gradually as the user scrolls up.
function heightNeededForScroll(section) {
  const other = document.documentElement.scrollHeight - section.offsetHeight;
  return Math.ceil(scrollY + innerHeight - other);
}

function reserveScrollPosition(section) {
  const need = heightNeededForScroll(section);
  section.style.minHeight = need > 0 ? need + 'px' : '';
}

window.addEventListener('scroll', () => {
  const section = document.getElementById('trackSection');
  if (!section.style.minHeight) return;
  const need = heightNeededForScroll(section);
  if (need <= 0) section.style.minHeight = '';
  else if (need < parseFloat(section.style.minHeight)) section.style.minHeight = need + 'px';
}, { passive: true });

async function loadSnapshot(entry, requestedDate) {
  const section = document.getElementById('trackSection');
  const token = ++loadToken;
  reserveScrollPosition(section);
  // Keep the old list on screen for fast loads so rows that persist don't blink.
  clearTimeout(loadingTimer);
  loadingTimer = setTimeout(() => {
    section.innerHTML = '<div class="loading">Loading…</div>';
    renderedUrls = null;
  }, 250);

  const prevEntry = getPreviousSnapshotEntry(currentPlaylist.snapshots, entry);
  const prevDayEntry = getPreviousDayLastSnapshot(currentPlaylist.snapshots, entry);

  // Fire all three fetches in parallel; getSnapshot dedups any overlap
  // (e.g. prevEntry === prevDayEntry on the first snapshot of a day) via
  // its promise cache, so we never issue duplicate network requests.
  const snapP = getSnapshot(entry);
  const prevP = getSnapshot(prevEntry);
  const prevDayP = getSnapshot(prevDayEntry);

  // A newer selection may finish first; a stale load must not touch the page.
  try {
    const snap = await snapP;
    if (token !== loadToken) return;
    updateHeader(snap);  // paint header as soon as the main snapshot lands

    const [prevSnap, prevDaySnap] = await Promise.all([prevP, prevDayP]);
    if (token !== loadToken) return;

    lastSnap = snap;
    lastEntry = entry;
    lastPrevSnap = prevSnap;
    lastPrevDaySnap = prevDaySnap;
    lastRequestedDate = requestedDate;
    lastIsExactSnapshot = !requestedDate;
    // Deliberately do NOT reset showDiff — the diff toggle persists across
    // date and chip selections so the user can move around while comparing.
    clearTimeout(loadingTimer);
    renderTracks();
  } catch (err) {
    if (token !== loadToken) return;
    clearTimeout(loadingTimer);
    showTracksEmpty(`Failed to load snapshot: ${err.message}`);
  }
}

function toggleDiff() {
  showDiff = !showDiff;
  renderTracks();
}

async function selectSnapshotEntry(file) {
  const entry = currentPlaylist.snapshots.find(s => s.file === file);
  if (!entry) return;
  viewMode = 'update';
  await loadSnapshot(entry, null);
}

async function selectFullDay() {
  if (!lastEntry) return;
  const dayEntries = currentPlaylist.snapshots
    .filter(s => s.date === lastEntry.date)
    .sort((a, b) => a.time.localeCompare(b.time));
  const latestOfDay = dayEntries[dayEntries.length - 1];

  viewMode = 'fullday';
  if (latestOfDay.file !== lastEntry.file) {
    await loadSnapshot(latestOfDay, null);
  } else {
    renderTracks();
  }
}


async function renderTracks() {
  const snap = lastSnap;
  const prevSnap = lastPrevSnap;
  const prevDaySnap = lastPrevDaySnap;
  const requestedDate = lastRequestedDate;
  if (!snap) return;

  const section = document.getElementById('trackSection');

  const dayEntries = currentPlaylist.snapshots.filter(s => s.date === snap.snapshot_date)
    .sort((a, b) => a.time.localeCompare(b.time));
  const latestOfDayFile = dayEntries.length > 0 ? dayEntries[dayEntries.length - 1].file : null;

  // Diff target depends on view mode:
  //   'fullday' → today's latest vs previous day's latest (cumulative day-over-day)
  //   'update'  → current snapshot vs the immediately previous snapshot in the flat list.
  //              For the first snapshot of a day this equals the previous day's latest;
  //              for subsequent snapshots it's the previous same-day snapshot.
  const diffTarget = viewMode === 'fullday' ? prevDaySnap : prevSnap;
  const diff = (lastIsExactSnapshot && diffTarget)
    ? computeDiff(snap, diffTarget)
    : { added: new Set(), removedTracks: [], hasDiff: false };
  const showHighlights = showDiff && diff.hasDiff;


  const showChipRow = !requestedDate && dayEntries.length > 0;

  let chipsHtml = '';
  if (showChipRow) {
    chipsHtml = '<div class="time-chips">';
    chipsHtml += `<button class="time-chip${viewMode === 'fullday' ? ' active' : ''}" onclick="selectFullDay()">All changes</button>`;
    dayEntries.forEach((e) => {
      const isActive = viewMode === 'update' && lastEntry && e.file === lastEntry.file;
      const latestBadge = e.file === latestOfDayFile ? '<span class="chip-latest">Latest</span>' : '';
      chipsHtml += `<button class="time-chip${isActive ? ' active' : ''}" onclick="selectSnapshotEntry('${e.file}')">${formatTimeOfDay(e.time)}${latestBadge}</button>`;
    });
    chipsHtml += '</div>';
  }

  let captionHtml = '';
  if (!requestedDate && diffTarget) {
    const captionText = `Changes ${SINCE_PHRASE}`;
    captionHtml = `<div class="diff-caption">${captionText}</div>`;
  }

  let barHtml = '<div class="snapshot-bar">';

  const snapTime = snap.snapshot_time || snap.snapshot_date + 'T12:00:00Z';
  const timeStr = formatTimeOfDay(snapTime);

  if (requestedDate) {
    barHtml += `<span class="snapshot-meta">last updated on ${snap.snapshot_date}</span>`;
  } else {
    const label = viewMode === 'fullday' ? 'last updated at' : 'snapshot generated at';
    barHtml += `<span class="snapshot-time-meta">${label} ${timeStr}</span>`;
    barHtml += elapsedSpan(diffTarget && diffTarget.snapshot_time, snapTime);
  }

  barHtml += `<span class="snapshot-meta">${snap.track_count} tracks</span>`;

  if (diff.hasDiff) {
    const parts = [];
    if (diff.added.size > 0) parts.push(`<span class="added-text">+${diff.added.size}</span>`);
    if (diff.removedTracks.length > 0) parts.push(`<span class="removed-text">−${diff.removedTracks.length}</span>`);
    if (diff.moved.size > 0) parts.push(`<span class="moved-text">${diff.moved.size} moved</span>`);
    barHtml += `<span class="diff-summary">${parts.join(' ')}</span>`;
    barHtml += `<button class="diff-toggle${showDiff ? ' active' : ''}" onclick="toggleDiff()">diff</button>`;
  }

  barHtml += '</div>';

  // On a snapshot change (not a diff toggle), rows leaving collapse out first,
  // then rows not previously on screen expand in.
  const prevUrls = lastRenderedFile !== lastEntry.file ? renderedUrls : null;
  const nextUrls = new Set();
  let enterCount = 0;
  const enterAttrs = (t) => {
    nextUrls.add(t.spotify_url);
    if (!prevUrls || prevUrls.has(t.spotify_url)) return { cls: '', style: '' };
    return { cls: ' enter', style: ` style="--i:${Math.min(enterCount++, 12)}"` };
  };

  let listHtml = '<ul class="track-list">';

  if (showHighlights) {
    diff.removedTracks.forEach(t => {
      const a = enterAttrs(t);
      listHtml += renderTrackLi(t, 'track removed' + a.cls, '<span class="diff-badge removed-badge">−</span>', a.style);
    });
  }

  snap.tracks.forEach((t, i) => {
    const isAdded = showHighlights && diff.added.has(t.spotify_url);
    const isMoved = showHighlights && diff.moved.has(t.spotify_url);
    const a = enterAttrs(t);
    const cls = (isAdded ? 'track added' : isMoved ? 'track moved' : 'track') + a.cls;
    const badge = isAdded
      ? '<span class="diff-badge added-badge">+</span>'
      : isMoved
        ? '<span class="diff-badge moved-badge" title="Moved">↕</span>'
        : `<span class="track-num">${i + 1}</span>`;
    listHtml += renderTrackLi(t, cls, badge, a.style);
  });

  listHtml += '</ul>';
  const dayNavHtml = renderDayNavHtml();
  const renderedFile = lastEntry.file;

  const token = ++renderToken;
  if (prevUrls && !reducedMotion.matches) {
    const leaving = [...section.querySelectorAll('.track[data-url]')]
      .filter(li => !nextUrls.has(li.dataset.url));
    if (leaving.length) {
      leaving.forEach(li => li.classList.add('leave'));
      await new Promise(r => setTimeout(r, LEAVE_MS));
      if (token !== renderToken) return;
    }
  }

  // FLIP: record where surviving rows sit now, swap the DOM, then slide each
  // row from its old spot to its new one (this is what makes reorders visible).
  const oldTops = new Map();
  if (prevUrls && !reducedMotion.matches) {
    forEachTrackKey(section, (li, key) => {
      if (!li.classList.contains('leave')) oldTops.set(key, li.getBoundingClientRect().top);
    });
  }

  renderedUrls = nextUrls;
  lastRenderedFile = renderedFile;
  section.innerHTML = dayNavHtml + chipsHtml + captionHtml + barHtml + listHtml;

  if (oldTops.size) {
    const shifts = [];
    forEachTrackKey(section, (li, key) => {
      if (li.classList.contains('enter') || !oldTops.has(key)) return;
      const dy = oldTops.get(key) - li.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) shifts.push([li, dy]);
    });
    shifts.forEach(([li, dy]) => { li.style.transform = `translateY(${dy}px)`; });
    section.offsetHeight;  // commit the offset positions before animating back
    shifts.forEach(([li]) => {
      li.style.transition = 'transform 0.4s ease';
      li.style.transform = '';
      li.addEventListener('transitionend', () => { li.style.transition = ''; }, { once: true });
    });
  }
}

// Keys rows by URL plus occurrence count so duplicate tracks stay distinct.
function forEachTrackKey(section, fn) {
  const seen = new Map();
  section.querySelectorAll('.track[data-url]').forEach(li => {
    const n = (seen.get(li.dataset.url) || 0) + 1;
    seen.set(li.dataset.url, n);
    fn(li, `${li.dataset.url}#${n}`);
  });
}

function showTracksEmpty(message) {
  renderToken++;
  loadToken++;
  clearTimeout(loadingTimer);
  renderedUrls = null;
  document.getElementById('trackSection').innerHTML =
    `<div class="empty-state">${escapeHtml(message)}</div>`;
}

function elapsedSpan(diffTargetTime, snapTime) {
  if (!diffTargetTime) return '';
  const elapsed = formatElapsed(diffTargetTime, snapTime);
  return `<span class="snapshot-time-meta">· ${elapsed} ${SINCE_PHRASE}</span>`;
}

function renderTrackLi(t, cls, badge, style = '') {
  return `
      <li class="${cls}" data-url="${escapeHtml(t.spotify_url)}"${style}>
        ${badge}
        <div class="track-info">
          <div class="track-name">${escapeHtml(t.name)}</div>
          <div class="track-artist">${escapeHtml(t.artists.join(', '))}</div>
        </div>
        <span class="track-duration">${formatDuration(t.duration_ms)}</span>
        <a class="track-link" href="${safeUrl(t.spotify_url)}" target="_blank" rel="noopener">${SPOTIFY_ICON}</a>
      </li>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

// Only allow http(s) URLs into href attributes; anything else (javascript:,
// data:, mailto:, etc.) becomes '#' so a malicious value in playlists.json
// or a scraped field can't fire on click.
function safeUrl(url) {
  const s = String(url ?? '');
  return /^https?:\/\//i.test(s) ? escapeHtml(s) : '#';
}

// --- Init ---

async function init() {
  try {
    indexData = await fetchJSON(`${BASE}snapshots/index.json`);
  } catch {
    showTracksEmpty('Could not load snapshot index.');
    return;
  }

  const playlists = indexData.playlists;
  if (playlists.length === 0) {
    showTracksEmpty('No playlists tracked yet.');
    return;
  }

  if (playlists.length > 1) {
    const sel = document.getElementById('playlistSelect');
    sel.style.display = '';
    playlists.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => {
      switchPlaylist(playlists[parseInt(sel.value)]);
    });
  }

  switchPlaylist(playlists[0]);
}

function switchPlaylist(playlist) {
  currentPlaylist = playlist;
  const titleEl = document.getElementById('title');
  titleEl.textContent = playlist.name;
  titleEl.href = `https://open.spotify.com/playlist/${playlist.id}`;
  titleEl.target = '_blank';
  titleEl.rel = 'noopener';

  // Reset all per-playlist state so nothing leaks across a switch.
  currentCoverArt = null;
  currentOwner = null;
  snapshotCache = {};
  lastSnap = null;
  lastEntry = null;
  renderedUrls = null;
  lastRenderedFile = null;
  lastPrevSnap = null;
  lastPrevDaySnap = null;
  lastRequestedDate = null;
  lastIsExactSnapshot = false;
  showDiff = false;
  viewMode = 'fullday';

  const embedFrame = document.getElementById('embedFrame');
  const embedSection = document.getElementById('embedSection');
  const embedSrc = `https://open.spotify.com/embed/playlist/${playlist.id}?utm_source=generator&theme=0`;
  if (embedFrame.src !== embedSrc) embedFrame.src = embedSrc;
  embedSection.style.display = '';

  const snapshots = playlist.snapshots;
  const today = todayUtcDate();
  const [y, m] = today.split('-').map(Number);
  calYear = y;
  calMonth = m - 1;

  if (snapshots.length > 0) {
    selectedDate = today;
    renderCalendar();
    selectDate(today);
  } else {
    selectedDate = null;
    renderCalendar();
    showTracksEmpty('No snapshots for this playlist yet.');
  }
}

init();
</script>
