<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4benies Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-raised: #1c1c1c;
    --surface-hover: #252525;
    --text: #ececec;
    --text-secondary: #999;
    --text-muted: #666;
    --green: #1db954;
    --green-soft: #1ed760;
    --green-dim: rgba(29, 185, 84, 0.12);
    --red: #e05555;
    --red-dim: rgba(224, 85, 85, 0.12);
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  /* Hero / Playlist Header */
  .playlist-header {
    display: flex;
    gap: 1.25rem;
    align-items: flex-end;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .cover-art {
    width: 120px;
    height: 120px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .cover-placeholder {
    width: 120px;
    height: 120px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-raised) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: var(--text-muted);
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .playlist-meta {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 0;
  }

  .playlist-type {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .playlist-name {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playlist-name a {
    color: inherit;
    text-decoration: none;
    transition: color 0.15s;
  }

  .playlist-name a:hover {
    color: var(--green);
  }

  .playlist-owner {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .playlist-owner strong {
    color: var(--text);
    font-weight: 500;
  }

  /* Playlist selector */
  .playlist-select {
    width: 100%;
    padding: 0.6rem 0.85rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    margin-bottom: 1.25rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }

  .playlist-select:focus {
    border-color: var(--green);
  }

  /* Calendar */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    margin-bottom: 1.75rem;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.85rem;
  }

  .cal-header button {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: inherit;
  }

  .cal-header button:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .cal-header .month-label {
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: -0.01em;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
  }

  .cal-dow {
    font-size: 0.65rem;
    color: var(--text-muted);
    padding: 0.35rem 0;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .cal-day {
    position: relative;
    padding: 0.45rem 0;
    font-size: 0.8rem;
    border-radius: 6px;
    cursor: default;
    color: var(--text-muted);
    transition: all 0.12s;
  }

  .cal-day.has-snapshot {
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
  }

  .cal-day.has-snapshot:hover {
    background: var(--surface-hover);
  }

  .cal-day.changed::after {
    content: '';
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: var(--green);
    border-radius: 50%;
  }

  .cal-day.selected {
    background: var(--green);
    color: #fff;
    font-weight: 600;
  }

  .cal-day.selected::after {
    background: rgba(255,255,255,0.8);
  }

  .cal-day.other-month {
    opacity: 0.2;
  }

  /* Snapshot info bar */
  .snapshot-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    padding: 0 0.25rem;
  }

  .snapshot-date-label {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .snapshot-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--surface);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
  }

  .time-chips {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    padding: 0 0.25rem;
  }

  .time-chips-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-right: 0.25rem;
  }

  .time-chip {
    font-size: 0.7rem;
    font-family: inherit;
    font-weight: 500;
    padding: 0.25rem 0.55rem;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: none;
    color: var(--text-secondary);
    transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }

  .time-chip:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .time-chip.active {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green-soft);
  }

  .snapshot-time-meta {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .diff-summary {
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .diff-summary .added-text { color: var(--green-soft); }
  .diff-summary .removed-text { color: var(--red); }

  .diff-toggle {
    margin-left: auto;
    font-size: 0.75rem;
    font-family: inherit;
    font-weight: 500;
    padding: 0.25rem 0.6rem;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: none;
    color: var(--text-secondary);
    transition: all 0.15s;
    white-space: nowrap;
  }

  .diff-toggle:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .diff-toggle.active {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green-soft);
  }

  /* Track list */
  .track-list {
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .track {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.85rem;
    transition: background 0.12s;
    border-bottom: 1px solid var(--border);
  }

  .track:last-child { border-bottom: none; }

  .track:hover {
    background: var(--surface-hover);
  }

  .track.added {
    background: var(--green-dim);
  }
  .track.added:hover {
    background: rgba(29, 185, 84, 0.18);
  }

  .track.removed {
    background: var(--red-dim);
    opacity: 0.6;
  }

  .track-num {
    color: var(--text-muted);
    font-size: 0.75rem;
    min-width: 1.5rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-name {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }

  .track.removed .track-name {
    text-decoration: line-through;
    text-decoration-color: var(--red);
  }

  .track-artist {
    font-size: 0.75rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-duration {
    color: var(--text-muted);
    font-size: 0.75rem;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .track-link {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-decoration: none;
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    transition: all 0.15s;
  }

  .track-link:hover {
    color: var(--green);
    background: var(--green-dim);
  }

  .track-link svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  .diff-badge {
    font-size: 0.6rem;
    font-weight: 700;
    min-width: 1.5rem;
    text-align: center;
    padding: 0.15rem 0.3rem;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .diff-badge.added-badge {
    background: var(--green-dim);
    color: var(--green-soft);
  }

  .diff-badge.removed-badge {
    background: var(--red-dim);
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem;
    font-size: 0.85rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.25rem 1rem; }
    .playlist-header { gap: 1rem; }
    .cover-art, .cover-placeholder { width: 88px; height: 88px; }
    .playlist-name { font-size: 1.35rem; }
    .track { padding: 0.55rem 0.65rem; gap: 0.5rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="playlist-header" id="playlistHeader">
    <div class="cover-placeholder" id="coverArt">♫</div>
    <div class="playlist-meta">
      <span class="playlist-type">Playlist</span>
      <h1 class="playlist-name"><a id="title" href="#">4benies Tracker</a></h1>
      <span class="playlist-owner" id="owner"></span>
    </div>
  </div>

  <select class="playlist-select" id="playlistSelect" style="display: none;"></select>

  <div class="calendar" id="calendar"></div>

  <div id="trackSection"></div>
</div>

<script>
const BASE = '';
const SPOTIFY_ICON = '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>';
let indexData = null;
let currentPlaylist = null;
let calYear, calMonth;
let selectedDate = null;
let snapshotCache = {};
let currentCoverArt = null;
let currentOwner = null;
let showDiff = false;
let lastSnap = null;
let lastPrevSnap = null;
let lastRequestedDate = null;
let lastIsExactSnapshot = false;
let lastEntry = null;

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to fetch ${url}`);
  return res.json();
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function formatTimeOfDay(iso) {
  const m = iso.match(/T(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]} UTC` : iso;
}

function formatElapsed(fromIso, toIso) {
  const from = new Date(fromIso).getTime();
  const to = new Date(toIso).getTime();
  let sec = Math.max(0, Math.floor((to - from) / 1000));
  const d = Math.floor(sec / 86400); sec -= d * 86400;
  const h = Math.floor(sec / 3600);  sec -= h * 3600;
  const m = Math.floor(sec / 60);
  const parts = [];
  if (d) parts.push(`${d}d`);
  if (h || d) parts.push(`${h}h`);
  parts.push(`${m}m`);
  return parts.join(' ');
}

// Returns Map<dateStr, Array<{date, time, file}>> sorted ascending by time within each day
function groupSnapshotsByDate(snapshots) {
  const byDate = new Map();
  for (const s of snapshots) {
    if (!byDate.has(s.date)) byDate.set(s.date, []);
    byDate.get(s.date).push(s);
  }
  for (const arr of byDate.values()) arr.sort((a, b) => a.time.localeCompare(b.time));
  return byDate;
}

// Returns the latest snapshot on-or-before targetDate, or null.
function findLatestSnapshotOnOrBefore(snapshots, targetDate) {
  let best = null;
  for (const s of snapshots) {
    if (s.date <= targetDate && (!best || s.time > best.time)) best = s;
  }
  return best;
}

// Returns the snapshot immediately preceding the given one, or null.
function getPreviousSnapshotEntry(snapshots, current) {
  const sorted = [...snapshots].sort((a, b) => a.time.localeCompare(b.time));
  const idx = sorted.findIndex(s => s.time === current.time && s.file === current.file);
  return idx > 0 ? sorted[idx - 1] : null;
}

function updateHeader(snap) {
  const coverEl = document.getElementById('coverArt');
  const ownerEl = document.getElementById('owner');

  if (snap && snap.cover_art) {
    if (currentCoverArt !== snap.cover_art) {
      coverEl.outerHTML = `<img class="cover-art" id="coverArt" src="${snap.cover_art}" alt="Playlist cover">`;
      currentCoverArt = snap.cover_art;
    }
  } else if (!currentCoverArt) {
    coverEl.outerHTML = '<div class="cover-placeholder" id="coverArt">♫</div>';
  }

  if (snap && snap.owner) {
    ownerEl.innerHTML = `by <strong>${escapeHtml(snap.owner)}</strong>`;
    currentOwner = snap.owner;
  } else if (currentOwner) {
    ownerEl.innerHTML = `by <strong>${escapeHtml(currentOwner)}</strong>`;
  }
}

// --- Calendar ---

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const snapshots = currentPlaylist ? currentPlaylist.snapshots : [];
  const byDate = groupSnapshotsByDate(snapshots);
  const sortedDates = [...byDate.keys()].sort();
  const firstDate = sortedDates.length > 0 ? sortedDates[0] : null;

  const monthNames = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let html = `
    <div class="cal-header">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label">${monthNames[calMonth]} ${calYear}</span>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">Su</div><div class="cal-dow">Mo</div>
      <div class="cal-dow">Tu</div><div class="cal-dow">We</div>
      <div class="cal-dow">Th</div><div class="cal-dow">Fr</div>
      <div class="cal-dow">Sa</div>
  `;

  for (let i = firstDay - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month">${daysInPrev - i}</div>`;
  }

  const today = new Date().toISOString().slice(0, 10);
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isSnapshotDate = byDate.has(dateStr);
    const canRender = firstDate && dateStr >= firstDate && dateStr <= today;
    const isSelected = dateStr === selectedDate;
    const classes = ['cal-day'];
    if (canRender) classes.push('has-snapshot');
    if (isSnapshotDate) classes.push('changed');
    if (isSelected) classes.push('selected');
    html += `<div class="${classes.join(' ')}" onclick="selectDate('${dateStr}')">${d}</div>`;
  }

  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month">${i}</div>`;
  }

  html += '</div>';
  cal.innerHTML = html;
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

// --- Selection ---

async function selectDate(dateStr) {
  if (!currentPlaylist) return;

  const latest = findLatestSnapshotOnOrBefore(currentPlaylist.snapshots, dateStr);

  if (!latest) {
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">No snapshots before this date.</div>';
    selectedDate = dateStr;
    renderCalendar();
    return;
  }

  selectedDate = dateStr;
  renderCalendar();
  await loadSnapshot(latest, dateStr !== latest.date ? dateStr : null);
}

async function loadSnapshot(entry, requestedDate) {
  const section = document.getElementById('trackSection');
  section.innerHTML = '<div class="loading">Loading…</div>';

  const pid = currentPlaylist.id;
  const cacheKey = `${pid}/${entry.file}`;

  try {
    if (!snapshotCache[cacheKey]) {
      snapshotCache[cacheKey] = await fetchJSON(`${BASE}snapshots/${pid}/${entry.file}`);
    }
    const snap = snapshotCache[cacheKey];

    updateHeader(snap);

    const prevEntry = getPreviousSnapshotEntry(currentPlaylist.snapshots, entry);
    let prevSnap = null;
    if (prevEntry) {
      const prevKey = `${pid}/${prevEntry.file}`;
      if (!snapshotCache[prevKey]) {
        snapshotCache[prevKey] = await fetchJSON(`${BASE}snapshots/${pid}/${prevEntry.file}`);
      }
      prevSnap = snapshotCache[prevKey];
    }

    lastSnap = snap;
    lastEntry = entry;
    lastPrevSnap = prevSnap;
    lastRequestedDate = requestedDate;
    lastIsExactSnapshot = !requestedDate;
    showDiff = false;
    renderTracks();
  } catch (err) {
    section.innerHTML = `<div class="empty-state">Failed to load snapshot: ${err.message}</div>`;
  }
}

function toggleDiff() {
  showDiff = !showDiff;
  renderTracks();
}

async function selectSnapshotEntry(file) {
  const entry = currentPlaylist.snapshots.find(s => s.file === file);
  if (!entry) return;
  await loadSnapshot(entry, null);
}

function renderTracks() {
  const snap = lastSnap;
  const prevSnap = lastPrevSnap;
  const requestedDate = lastRequestedDate;
  if (!snap) return;

  const section = document.getElementById('trackSection');

  const currentUrls = new Set(snap.tracks.map(t => t.spotify_url));
  const prevUrls = prevSnap ? new Set(prevSnap.tracks.map(t => t.spotify_url)) : new Set();
  const added = prevSnap ? new Set([...currentUrls].filter(u => !prevUrls.has(u))) : new Set();
  const removedTracks = prevSnap ? prevSnap.tracks.filter(t => !currentUrls.has(t.spotify_url)) : [];
  const hasDiff = lastIsExactSnapshot && prevSnap && (added.size > 0 || removedTracks.length > 0);

  const dayEntries = currentPlaylist.snapshots.filter(s => s.date === snap.snapshot_date)
    .sort((a, b) => a.time.localeCompare(b.time));

  let chipsHtml = '';
  if (dayEntries.length > 1) {
    chipsHtml = '<div class="time-chips">';
    chipsHtml += '<span class="time-chips-label">Updates on this day</span>';
    for (const e of dayEntries) {
      const isActive = lastEntry && e.file === lastEntry.file;
      chipsHtml += `<button class="time-chip${isActive ? ' active' : ''}" onclick="selectSnapshotEntry('${e.file}')">${formatTimeOfDay(e.time)}</button>`;
    }
    chipsHtml += '</div>';
  }

  let barHtml = '<div class="snapshot-bar">';
  barHtml += `<span class="snapshot-date-label">${snap.snapshot_date}</span>`;

  if (requestedDate) {
    barHtml += `<span class="snapshot-meta">last updated on ${snap.snapshot_date}</span>`;
  } else {
    const timeStr = formatTimeOfDay(snap.snapshot_time || snap.snapshot_date + 'T12:00:00Z');
    barHtml += `<span class="snapshot-time-meta">last updated at ${timeStr}</span>`;
  }

  if (prevSnap && prevSnap.snapshot_time && snap.snapshot_time && !requestedDate) {
    const elapsed = formatElapsed(prevSnap.snapshot_time, snap.snapshot_time);
    barHtml += `<span class="snapshot-time-meta">· ${elapsed} since previous update</span>`;
  }

  barHtml += `<span class="snapshot-meta">${snap.track_count} tracks</span>`;

  if (hasDiff) {
    const parts = [];
    if (added.size > 0) parts.push(`<span class="added-text">+${added.size}</span>`);
    if (removedTracks.length > 0) parts.push(`<span class="removed-text">−${removedTracks.length}</span>`);
    barHtml += `<span class="diff-summary">${parts.join(' ')}</span>`;
    barHtml += `<button class="diff-toggle${showDiff ? ' active' : ''}" onclick="toggleDiff()">diff</button>`;
  }

  barHtml += '</div>';

  let listHtml = '<ul class="track-list">';

  if (showDiff && hasDiff) {
    removedTracks.forEach(t => {
      listHtml += `
        <li class="track removed">
          <span class="diff-badge removed-badge">−</span>
          <div class="track-info">
            <div class="track-name">${escapeHtml(t.name)}</div>
            <div class="track-artist">${escapeHtml(t.artists.join(', '))}</div>
          </div>
          <span class="track-duration">${formatDuration(t.duration_ms)}</span>
          <a class="track-link" href="${t.spotify_url}" target="_blank" rel="noopener">${SPOTIFY_ICON}</a>
        </li>`;
    });
  }

  snap.tracks.forEach((t, i) => {
    const isAdded = showDiff && hasDiff && added.has(t.spotify_url);
    const cls = isAdded ? 'track added' : 'track';
    const badge = isAdded
      ? '<span class="diff-badge added-badge">+</span>'
      : `<span class="track-num">${i + 1}</span>`;

    listHtml += `
      <li class="${cls}">
        ${badge}
        <div class="track-info">
          <div class="track-name">${escapeHtml(t.name)}</div>
          <div class="track-artist">${escapeHtml(t.artists.join(', '))}</div>
        </div>
        <span class="track-duration">${formatDuration(t.duration_ms)}</span>
        <a class="track-link" href="${t.spotify_url}" target="_blank" rel="noopener">${SPOTIFY_ICON}</a>
      </li>`;
  });

  listHtml += '</ul>';
  section.innerHTML = chipsHtml + barHtml + listHtml;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Init ---

async function init() {
  try {
    indexData = await fetchJSON(`${BASE}snapshots/index.json`);
  } catch {
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">Could not load snapshot index.</div>';
    return;
  }

  const playlists = indexData.playlists;
  if (playlists.length === 0) {
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">No playlists tracked yet.</div>';
    return;
  }

  if (playlists.length > 1) {
    const sel = document.getElementById('playlistSelect');
    sel.style.display = '';
    playlists.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => {
      switchPlaylist(playlists[parseInt(sel.value)]);
    });
  }

  switchPlaylist(playlists[0]);
}

function switchPlaylist(playlist) {
  currentPlaylist = playlist;
  const titleEl = document.getElementById('title');
  titleEl.textContent = playlist.name;
  titleEl.href = `https://open.spotify.com/playlist/${playlist.id}`;
  titleEl.target = '_blank';
  titleEl.rel = 'noopener';
  currentCoverArt = null;
  currentOwner = null;

  const snapshots = playlist.snapshots;
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  calYear = now.getFullYear();
  calMonth = now.getMonth();

  if (snapshots.length > 0) {
    selectedDate = today;
    renderCalendar();
    selectDate(today);
  } else {
    selectedDate = null;
    renderCalendar();
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">No snapshots for this playlist yet.</div>';
  }
}

init();
</script>

</html>
