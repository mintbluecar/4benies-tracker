<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4benies Tracker</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-hover: #282828;
    --text: #e0e0e0;
    --text-muted: #a0a0a0;
    --green: #1db954;
    --green-dim: rgba(29, 185, 84, 0.15);
    --red: #e05555;
    --red-dim: rgba(224, 85, 85, 0.15);
    --border: #333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
  }

  /* Playlist selector */
  .playlist-select {
    width: 100%;
    padding: 0.5rem 0.75rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    margin-bottom: 1rem;
    cursor: pointer;
  }

  /* Calendar */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .cal-header button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
  }

  .cal-header button:hover { background: var(--surface-hover); }

  .cal-header .month-label {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
  }

  .cal-dow {
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0.25rem 0;
    font-weight: 600;
  }

  .cal-day {
    position: relative;
    padding: 0.4rem 0;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: default;
    color: var(--text-muted);
  }

  .cal-day.has-snapshot {
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
  }

  .cal-day.has-snapshot:hover {
    background: var(--surface-hover);
  }

  .cal-day.has-snapshot::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: var(--green);
    border-radius: 50%;
  }

  .cal-day.selected {
    background: var(--green);
    color: #fff;
  }

  .cal-day.selected::after {
    background: #fff;
  }

  .cal-day.other-month {
    opacity: 0.3;
  }

  /* Snapshot info */
  .snapshot-info {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .snapshot-date {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .snapshot-note {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .track-count {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-left: auto;
  }

  /* Track list */
  .track-list {
    list-style: none;
  }

  .track {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    transition: background 0.15s;
  }

  .track:hover {
    background: var(--surface-hover);
  }

  .track.added {
    background: var(--green-dim);
  }

  .track.removed {
    background: var(--red-dim);
    text-decoration: line-through;
    opacity: 0.7;
  }

  .track-num {
    color: var(--text-muted);
    font-size: 0.8rem;
    min-width: 1.5rem;
    text-align: right;
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-name {
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-duration {
    color: var(--text-muted);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .track-link {
    color: var(--green);
    text-decoration: none;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .track-link:hover { opacity: 0.8; }

  .diff-badge {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .diff-badge.added-badge {
    background: var(--green-dim);
    color: var(--green);
  }

  .diff-badge.removed-badge {
    background: var(--red-dim);
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem;
  }

  @media (max-width: 480px) {
    body { padding: 1rem; }
    .track { padding: 0.5rem; gap: 0.5rem; }
  }
</style>
</head>
<body>

<div class="container">
  <h1 id="title">4benies Tracker</h1>
  <p class="subtitle">Spotify playlist snapshot history</p>

  <select class="playlist-select" id="playlistSelect" style="display: none;"></select>

  <div class="calendar" id="calendar"></div>

  <div id="trackSection"></div>
</div>

<script>
const BASE = '';
let indexData = null;
let currentPlaylist = null;
let calYear, calMonth;
let selectedDate = null;
let snapshotCache = {};

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to fetch ${url}`);
  return res.json();
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function findNearestSnapshot(dates, target) {
  let best = null;
  for (const d of dates) {
    if (d <= target && (!best || d > best)) best = d;
  }
  return best;
}

function getPreviousSnapshot(dates, current) {
  const sorted = [...dates].sort();
  const idx = sorted.indexOf(current);
  return idx > 0 ? sorted[idx - 1] : null;
}

// --- Calendar ---

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const snapshots = currentPlaylist ? currentPlaylist.snapshots : [];
  const snapshotSet = new Set(snapshots);

  const monthNames = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let html = `
    <div class="cal-header">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label">${monthNames[calMonth]} ${calYear}</span>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">Su</div><div class="cal-dow">Mo</div>
      <div class="cal-dow">Tu</div><div class="cal-dow">We</div>
      <div class="cal-dow">Th</div><div class="cal-dow">Fr</div>
      <div class="cal-dow">Sa</div>
  `;

  // Previous month padding
  for (let i = firstDay - 1; i >= 0; i--) {
    const day = daysInPrev - i;
    html += `<div class="cal-day other-month">${day}</div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const hasSnap = snapshotSet.has(dateStr);
    const isSelected = dateStr === selectedDate;
    const classes = ['cal-day'];
    if (hasSnap) classes.push('has-snapshot');
    if (isSelected) classes.push('selected');
    const onclick = `onclick="selectDate('${dateStr}')"`;
    html += `<div class="${classes.join(' ')}" ${onclick}>${d}</div>`;
  }

  // Next month padding
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month">${i}</div>`;
  }

  html += '</div>';
  cal.innerHTML = html;
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

// --- Selection ---

async function selectDate(dateStr) {
  if (!currentPlaylist) return;

  const snapDates = currentPlaylist.snapshots;
  const nearest = findNearestSnapshot(snapDates, dateStr);

  if (!nearest) {
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">No snapshots before this date.</div>';
    selectedDate = dateStr;
    renderCalendar();
    return;
  }

  selectedDate = dateStr;
  renderCalendar();
  await loadSnapshot(nearest, dateStr !== nearest ? dateStr : null);
}

async function loadSnapshot(snapshotDate, requestedDate) {
  const section = document.getElementById('trackSection');
  section.innerHTML = '<div class="loading">Loading…</div>';

  const pid = currentPlaylist.id;
  const cacheKey = `${pid}/${snapshotDate}`;

  try {
    if (!snapshotCache[cacheKey]) {
      snapshotCache[cacheKey] = await fetchJSON(`${BASE}snapshots/${pid}/${snapshotDate}.json`);
    }
    const snap = snapshotCache[cacheKey];

    // Load previous snapshot for diff
    const prevDate = getPreviousSnapshot(currentPlaylist.snapshots, snapshotDate);
    let prevSnap = null;
    if (prevDate) {
      const prevKey = `${pid}/${prevDate}`;
      if (!snapshotCache[prevKey]) {
        snapshotCache[prevKey] = await fetchJSON(`${BASE}snapshots/${pid}/${prevDate}.json`);
      }
      prevSnap = snapshotCache[prevKey];
    }

    renderTracks(snap, prevSnap, requestedDate);
  } catch (err) {
    section.innerHTML = `<div class="empty-state">Failed to load snapshot: ${err.message}</div>`;
  }
}

function renderTracks(snap, prevSnap, requestedDate) {
  const section = document.getElementById('trackSection');

  // Build diff
  const currentUrls = new Set(snap.tracks.map(t => t.spotify_url));
  const prevUrls = prevSnap ? new Set(prevSnap.tracks.map(t => t.spotify_url)) : new Set();

  const added = prevSnap ? new Set([...currentUrls].filter(u => !prevUrls.has(u))) : new Set();
  const removedTracks = prevSnap ? prevSnap.tracks.filter(t => !currentUrls.has(t.spotify_url)) : [];

  let note = '';
  if (requestedDate) {
    note = `<span class="snapshot-note">showing snapshot from ${snap.snapshot_date}</span>`;
  }

  let diffSummary = '';
  if (prevSnap && (added.size > 0 || removedTracks.length > 0)) {
    const parts = [];
    if (added.size > 0) parts.push(`+${added.size} added`);
    if (removedTracks.length > 0) parts.push(`-${removedTracks.length} removed`);
    diffSummary = `<span class="snapshot-note">(${parts.join(', ')} since ${prevSnap.snapshot_date})</span>`;
  }

  let html = `
    <div class="snapshot-info">
      <span class="snapshot-date">${snap.snapshot_date}</span>
      ${note}
      ${diffSummary}
      <span class="track-count">${snap.track_count} tracks</span>
    </div>
    <ul class="track-list">
  `;

  // Show removed tracks first
  removedTracks.forEach(t => {
    html += `
      <li class="track removed">
        <span class="diff-badge removed-badge">−</span>
        <div class="track-info">
          <div class="track-name">${escapeHtml(t.name)}</div>
          <div class="track-artist">${escapeHtml(t.artists.join(', '))}</div>
        </div>
        <span class="track-duration">${formatDuration(t.duration_ms)}</span>
        <a class="track-link" href="${t.spotify_url}" target="_blank" rel="noopener">♫</a>
      </li>
    `;
  });

  // Current tracks
  snap.tracks.forEach((t, i) => {
    const isAdded = added.has(t.spotify_url);
    const cls = isAdded ? 'track added' : 'track';
    const badge = isAdded ? '<span class="diff-badge added-badge">+</span>' : `<span class="track-num">${i + 1}</span>`;

    html += `
      <li class="${cls}">
        ${badge}
        <div class="track-info">
          <div class="track-name">${escapeHtml(t.name)}</div>
          <div class="track-artist">${escapeHtml(t.artists.join(', '))}</div>
        </div>
        <span class="track-duration">${formatDuration(t.duration_ms)}</span>
        <a class="track-link" href="${t.spotify_url}" target="_blank" rel="noopener">♫</a>
      </li>
    `;
  });

  html += '</ul>';
  section.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Init ---

async function init() {
  try {
    indexData = await fetchJSON(`${BASE}snapshots/index.json`);
  } catch {
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">Could not load snapshot index.</div>';
    return;
  }

  const playlists = indexData.playlists;
  if (playlists.length === 0) {
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">No playlists tracked yet.</div>';
    return;
  }

  // Playlist selector
  if (playlists.length > 1) {
    const sel = document.getElementById('playlistSelect');
    sel.style.display = '';
    playlists.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => {
      switchPlaylist(playlists[parseInt(sel.value)]);
    });
  }

  switchPlaylist(playlists[0]);
}

function switchPlaylist(playlist) {
  currentPlaylist = playlist;
  document.getElementById('title').textContent = playlist.name;

  const snapshots = playlist.snapshots.sort();
  if (snapshots.length > 0) {
    const latest = snapshots[snapshots.length - 1];
    const [y, m] = latest.split('-').map(Number);
    calYear = y;
    calMonth = m - 1;
    selectedDate = latest;
    renderCalendar();
    loadSnapshot(latest, null);
  } else {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDate = null;
    renderCalendar();
    document.getElementById('trackSection').innerHTML =
      '<div class="empty-state">No snapshots for this playlist yet.</div>';
  }
}

init();
</script>
</body>
</html>
