name: Playlist Snapshot

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of overlapping, so two runs never race to push.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Take snapshot
        run: bash scripts/snapshot.sh

      # Runs even if one playlist failed, so the others' snapshots are kept;
      # the job still shows as failed from the step above.
      - name: Commit and push if changed
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
